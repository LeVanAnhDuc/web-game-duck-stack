name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The base path is the only build input passed here. Ducker ID sign-in is
      # shipped dark: the flag and the VITE_DUCKER_* vars are deliberately NOT
      # passed, so the deployed game never renders the button (ADR-0018).
      - run: pnpm build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      # `enablement` does NOT replace enabling Pages once for the repository.
      # Tried on the first deploy here and it failed: GITHUB_TOKEN cannot create a
      # Pages site -- "Resource not accessible by integration". It is kept because
      # it costs nothing and helps a fork whose owner has already enabled Pages.
      # The one-time step is in README §Releases and versioning.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
