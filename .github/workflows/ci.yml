name: CI

# Runs on every pull request. Without this, a branch could be merged red and the
# first thing to notice would be the deploy job on `main` -- after the merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The game app lives in client/; automation-testing/ sets its own directory per step.
defaults:
  run:
    working-directory: client

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The app lives in client/; without this the action looks for a
          # package.json at the root and finds none.
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      # `pnpm install --frozen-lockfile` and not a bare `pnpm install`: the
      # lockfile is the answer, and the workspace has already been bitten by a
      # different dependency tree.
      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # `pnpm build` is `tsc --noEmit && vite build`, so this covers typecheck.
      - run: pnpm build

      - name: Report bundle size against NFR-PERF-04
        run: |
          # The threshold lives in docs/02-requirements/nfr.md. Printed rather than
          # enforced for now: the budget is 200KB and the build is well under it, so
          # a hard gate would only ever fire on a mistake this log already shows.
          echo "gzip sizes of the built assets:"
          for f in dist/assets/*.js dist/assets/*.css; do
            [ -f "$f" ] || continue
            printf '  %-40s %s\n' "$(basename "$f")" "$(gzip -c "$f" | wc -c | awk '{printf "%.1f kB", $1/1024}')"
          done

  # The end-to-end regression suite (automation-testing/), against production
  # builds of the game. Its own job so it runs beside verify and the audit.
  e2e:
    name: Regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            automation-testing/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Both builds the suite serves: the Pages one (base path, sign-in off) and
      # the flag-on one against a fake issuer. Built here once, so the suite's
      # webServer only serves them (CLIENT_PREBUILT=1).
      - name: Build the e2e targets
        run: pnpm build:e2e

      - name: Install the regression suite
        working-directory: automation-testing
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: automation-testing
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck, unit, traceability
        working-directory: automation-testing
        run: pnpm typecheck && pnpm test:unit && pnpm coverage:check

      - name: Regression suite
        working-directory: automation-testing
        env:
          CLIENT_PREBUILT: "1"
        run: pnpm test

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: automation-testing/playwright-report/
          retention-days: 7

  # A SEPARATE job, so the audit runs beside the tests instead of in front of them.
  # Measured on the first run of this workflow, back when this repo was on npm:
  # `npm ci` took 157s and `npm audit` 212s while test and build together took 2s,
  # so the audit was 56% of a 377s critical path for no reason. The shape is what
  # matters, not the numbers: `pnpm audit` reads pnpm-lock.yaml and asks the
  # registry -- it needs no node_modules, so this job skips the install entirely.
  #
  # NFR-SEC-02 names CI as where this threshold is checked; this is that check.
  # `--audit-level=high` fails on high and critical only: moderate advisories in
  # dev-only tooling would otherwise block every pull request.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The app lives in client/; without this the action looks for a
          # package.json at the root and finds none.
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Retried, and an unreachable registry is NOT a failure. The audit endpoint
      # returned 503 on this workflow's own run, which turned a security check into
      # a random merge blocker for a reason that has nothing to do with the code.
      # A real advisory still fails the job; an outage reports and passes.
      - name: pnpm audit (high and above)
        run: |
          for attempt in 1 2 3; do
            out=$(pnpm audit --audit-level=high 2>&1) && { echo "$out"; exit 0; }
            code=$?
            # ERR_PNPM_AUDIT_BAD_RESPONSE is how pnpm reports the outage npm used
            # to phrase as "audit endpoint returned an error". Both spellings are
            # matched, because the message text is the only thing separating
            # "registry is down" from "you have a vulnerability" -- neither tool
            # gives the two a distinct exit code.
            if echo "$out" | grep -qiE 'ERR_PNPM_AUDIT|audit endpoint|Service Unavailable|ENOTFOUND|ETIMEDOUT|ECONNRESET'; then
              echo "::warning::audit attempt $attempt could not reach the registry"
              sleep $((attempt * 15))
              continue
            fi
            echo "$out"
            exit $code
          done
          echo "::warning::pnpm audit could not reach the registry after 3 attempts; not failing the build for someone else's outage"

